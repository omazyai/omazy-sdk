[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omazy"
version = "0.5.3"
description = "Client for the Omazy Core API and its MCP server: models, knowledge, your agent, speech and calls from your own backend."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mosthofa Imran" }]
keywords = ["omazy", "ai", "llm", "agents", "mcp", "knowledge-base", "voice", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://docs.omazy.ai/reference/core-api/"
Documentation = "https://docs.omazy.ai/reference/core-api/"
Repository = "https://github.com/omazyai/omazy-sdk"
Issues = "https://github.com/omazyai/omazy-sdk/issues"
Changelog = "https://github.com/omazyai/omazy-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/omazy"]
